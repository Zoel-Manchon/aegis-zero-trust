[package]
name = "aegis"
version = "0.1.0"
edition = "2024"          # requires Rust >= 1.85

[dependencies]
# --- web / async ------------------------------------------------------------
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "set-header"] }
async-trait = "0.1.91"
async-stream = "0.3.6"
futures-core = "0.3.33"

# --- data -------------------------------------------------------------------
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "chrono",
    "ipnetwork",
    "uuid",
    "tls-rustls",
] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# --- crypto / auth ----------------------------------------------------------
argon2 = "0.5.3"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
totp-rs = { version = "5.7", features = ["otpauth"] }
aes-gcm = "0.10.3"                                  # envelope encryption for TOTP seeds at rest
sha2 = "0.11.0"
hmac = "0.13.0"
subtle = "2.6.1"
rand = { version = "0.8.6", features = ["std"] }   # >= 0.8.6 fixes RUSTSEC-2026-0097

# --- encoding / serde -------------------------------------------------------
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.22.1"
data-encoding = "2.11"
hex = "0.4.3"
validator = { version = "0.20.0", features = ["derive"] }

# --- misc -------------------------------------------------------------------
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24", features = ["serde", "v4", "v5"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1.0.104"                                  # >= 1.0.103 fixes RUSTSEC-2026-0190
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
dotenvy = "0.15.7"

# -----------------------------------------------------------------------------
# Deliberately held back (an editor plugin will flag these as "outdated" — they
# are not vulnerable, they are pinned because the next major is a breaking API):
#   sqlx        0.8  -> 0.9   rewrites the macro/driver API; requires regenerating .sqlx
#   redis       0.27 -> 1.x   connection-manager and command traits changed
#   reqwest     0.12 -> 0.13  new client builder + TLS backend selection
#   tower-http  0.6  -> 0.7   tracks the http 1.x / tower 0.6 rework
#   jsonwebtoken 10  -> 11    feature flags moved to `dep:` syntax
#   validator   0.20 -> 0.21  derive attribute syntax changed
#   base64      0.22 -> 0.23  engine API changes
#   rand        0.8  -> 0.10  ThreadRng / SeedableRng API changes
# Upgrade one at a time on a branch, not the week of a demo.
# -----------------------------------------------------------------------------

[dev-dependencies]
tower = "0.5.3"
http-body-util = "0.1.4"
bytes = "1.12"
