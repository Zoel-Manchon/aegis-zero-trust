# =============================================================================
# aegis — full stack: Postgres + Redis + Rust API + Caddy(web) + seed.
# Single origin via Caddy: open http://localhost:8080
#
#   docker compose up -d --build                  # db, redis, api, web
#   docker compose --profile seed run --rm seed   # one-shot: admin + victim
#
# Everything needed for a cold clone is committed: docker/db-init/01_schema.sql
# and aegis-api/.sqlx (see DOCKER.md).
# =============================================================================

name: aegis

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # Uncomment to reach Postgres from the host, e.g. to run `cargo sqlx prepare`
    # after changing a query! macro. Port 5433 avoids clashing with a local
    # Postgres already on 5432.
    # ports:
    #   - "5433:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./aegis-api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://aegis:aegis@db:5432/aegis
      DB_SSL_MODE: disable          # internal network; flip to require/verify-full for real TLS
      REDIS_URL: redis://redis:6379/
      REFRESH_SECRET: change-me-in-production-at-least-32-characters
      # Wraps the per-seed data keys that encrypt TOTP secrets at rest. This is
      # a known development value: with the Vault overlay the KEK lives in
      # Vault's transit engine instead and this variable is ignored.
      MFA_KEK: ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZAo=
      SERVER_ADDR: 0.0.0.0:3000
      BASE_URL: http://localhost:8080
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_ORIGIN: https://localhost
      WEBAUTHN_RP_NAME: Aegis
      RUST_LOG: info
    volumes:
      - api-keys:/app/keys          # persisted JWT keypair (stable tokens across restarts)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Healthcheck is defined in aegis-api/Dockerfile.

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      # 443 so the console lives at https://localhost with no port in the URL —
      # which is also exactly the origin WEBAUTHN_RP_ORIGIN declares.
      - "443:443"
      # 80 only redirects to HTTPS; nothing is served in cleartext.
      - "80:80"
    depends_on:
      api:
        condition: service_healthy   # don't serve a console that 502s on every call
    volumes:
      # Caddy's internal CA lives here. Without a volume it is regenerated on
      # every `down`, so a certificate trusted yesterday is untrusted today and
      # the browser warning reappears mid-demo.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  seed:
    image: postgres:17-alpine
    profiles: ["seed"]
    environment:
      PGPASSWORD: aegis
    # Piped through sed so a CRLF checkout of seed.sh still runs (the file is
    # bind-mounted, so .gitattributes is the real fix — this is the safety net).
    entrypoint: ["/bin/sh", "-c", "sed 's/\\r$$//' /seed/seed.sh | /bin/sh"]
    volumes:
      - ./docker/seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  db-data:
  api-keys:
